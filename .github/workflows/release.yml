name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.cuda }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-2022]
        python: ['3.11']
        cuda: [cpu]
        include:
          # CUDA wheels are built on Linux only (matches project support).
          - os: ubuntu-22.04
            python: '3.11'
            cuda: cu121
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: jimver/cuda-toolkit@v0.2.16
        if: matrix.cuda == 'cu121'
        with:
          cuda: '12.1.0'

      - name: Build wheel
        env:
          SKBUILD_CMAKE_DEFINE: ${{ matrix.cuda == 'cu121' && 'USE_CUDA=ON' || 'USE_CUDA=OFF' }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Smoke test (import + tiny op)
        shell: bash
        run: |
          pip install dist/*.whl numpy PyYAML typing-extensions
          python - <<'PY'
          import tensorplay as tp
          x = tp.rand(4, 4)
          y = x @ x
          assert y.shape == (4, 4)
          print("smoke ok:", tp.__version__ if hasattr(tp, "__version__") else "ok")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.cuda }}
          path: dist/*.whl

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
